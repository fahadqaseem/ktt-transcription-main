[project]
name = "ktt-ocr-eval"
version = "0.1.0"
description = "Local-first OCR evaluation harness for structured school record pages."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "typer>=0.12.0",
]

[project.scripts]
ktt-ocr = "ktt_ocr_eval.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.4.0",
]

[tool.uv]
package = true

[tool.ruff]
exclude = [".history"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"
